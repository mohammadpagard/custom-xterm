### WINDOWS ###
[window]
dimensions = { columns = 86, lines = 25 }
opacity = 0.97

### FONTS ###
[font]
normal = { family = "ComicShannsMono Nerd Font" }
size = 12
offset = { x = 1, y = 1 }


### COLORS ###
[colors.primary]
foreground = "#ffffff"
background = "#1e1e1e"

[colors.normal]
black = "#1a1a1a"
red = "#cc372e"
green = "#26a439"
yellow = "#cdac08"
blue = "#0869cb"
magenta = "#9647bf"
cyan = "#479ec2"
white = "#98989d"

[colors.bright]
black = "#464646"
red = "#ff453a"
green = "#32d74b"
yellow = "#ffd60a"
blue = "#0a84ff"
magenta = "#bf5af2"
cyan = "#76d6ff"
white = "#ffffff"

[colors]
transparent_background_colors = true
